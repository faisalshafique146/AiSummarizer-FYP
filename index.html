<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/src/assets/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="HiSumz turns long articles, reports, and notes into clear summaries."
    />
    <meta name="theme-color" content="#f8f8f6" />
    <script>
      try {
        const storedTheme = localStorage.getItem("hisumz-theme");
        const dark =
          storedTheme === "dark" ||
          (storedTheme !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", dark ? "#0b0f14" : "#f8f8f6");
      } catch {
        // Use the light theme when browser preferences are unavailable.
      }
    </script>
    <title>HiSumz — Clear summaries from long text</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
